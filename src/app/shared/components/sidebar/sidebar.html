<aside class="fixed left-0 top-0 h-full flex flex-col p-5 z-50 bg-white border-r border-outline-variant/20 w-[240px] transition-all duration-300 ease-in-out shadow-[4px_0_24px_rgba(0,59,92,0.02)]">
  
  <!-- Logo & Title -->
  <div class="mb-6 px-2 flex items-center gap-3">
    <div class="w-10 h-10 bg-primary-container rounded-xl flex items-center justify-center text-white shadow-md relative overflow-hidden group">
      <span class="material-symbols-outlined text-2xl z-10" style="font-variation-settings: 'FILL' 1;">school</span>
      <div class="absolute inset-0 bg-gradient-to-tr from-white/10 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
    </div>
    <div>
      <h1 class="text-xl font-black text-primary-container tracking-tight">FCC - BUAP</h1>
      <p class="text-[9px] uppercase tracking-widest text-outline font-bold leading-none mt-0.5">Grade System</p>
    </div>
  </div>

  <!-- Navigation Menu -->
  <nav class="flex-1 space-y-0.5 overflow-y-auto">
    @for (item of menuItems(); track item.route) {

      <!-- Separador de sección -->
      @if (item.section) {
        <div class="text-[9px] font-black text-[#c2c7ce] uppercase tracking-widest px-3 pt-4 pb-1.5 block">
          {{ item.section }}
        </div>
      }

      <!-- Enlace de navegación -->
      <a
        [routerLink]="item.route"
        routerLinkActive="bg-[#003b5c]/8 text-[#003b5c] border-l-[3px] border-[#003b5c] font-bold"
        [routerLinkActiveOptions]="{ exact: false }"
        class="flex items-center gap-3 px-3 py-2.5 text-[#42474e] hover:text-[#003b5c] hover:bg-[#f3f4f5] rounded-lg font-semibold text-[13px] transition-all duration-150 border-l-[3px] border-transparent"
      >
        <span class="material-symbols-outlined text-[20px] flex-shrink-0">{{ item.icon }}</span>
        <span class="truncate">{{ item.label }}</span>
      </a>

    }
  </nav>

  <!-- Help & Sign Out Footer -->
  <div class="mt-auto pt-4 border-t border-outline-variant/10 space-y-1">
    <a 
      href="#"
      class="flex items-center gap-3 px-3 py-2.5 text-on-surface-variant hover:text-primary hover:bg-surface-container rounded-lg font-semibold text-[13px] transition-all duration-200 border-l-4 border-transparent"
    >
      <span class="material-symbols-outlined text-[20px]">help_outline</span>
      Centro de Ayuda
    </a>
    
    <button 
      (click)="logout()"
      class="w-full flex items-center gap-3 px-3 py-2.5 text-error hover:bg-error-container/20 rounded-lg font-bold text-[13px] transition-all duration-200 border-l-4 border-transparent text-left"
    >
      <span class="material-symbols-outlined text-[20px]">logout</span>
      Cerrar Sesión
    </button>
  </div>
</aside>
